<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <!-- Slate Indigo to Deep Indigo Gradient for Wings -->
    <linearGradient id="wingGradientLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#545B88"/>
      <stop offset="100%" stop-color="#353A5A"/>
    </linearGradient>
    <linearGradient id="wingGradientRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#545B88"/>
      <stop offset="100%" stop-color="#353A5A"/>
    </linearGradient>
    
    <!-- Muted Gold Gradient for Keyhole and Accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B25D"/>
      <stop offset="100%" stop-color="#C28B35"/>
    </linearGradient>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#323652" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- WINGED KEYHOLE ICON EMBLEM -->
  <g transform="translate(6, 4)" filter="url(#subtleGlow)">
    <!-- LEFT WING FEATHERS -->
    <!-- Top Feather (Sweeps up and left) -->
    <path d="M 44,32 C 34,24 18,17 2,13 C 12,19 26,27 41,37 Z" fill="url(#wingGradientLeft)"/>
    <!-- Middle Feather -->
    <path d="M 43,40 C 33,34 16,29 1,28 C 12,34 26,42 40,47 Z" fill="url(#wingGradientLeft)"/>
    <!-- Bottom Feather / Wing Base -->
    <path d="M 42,50 C 31,47 18,43 5,45 C 15,51 25,62 33,70 C 32,62 37,55 42,50 Z" fill="url(#wingGradientLeft)"/>

    <!-- RIGHT WING FEATHERS -->
    <!-- Top Feather (Sweeps up and right) -->
    <path d="M 60,32 C 70,24 86,17 102,13 C 92,19 78,27 63,37 Z" fill="url(#wingGradientRight)"/>
    <!-- Middle Feather -->
    <path d="M 61,40 C 71,34 88,29 103,28 C 92,34 78,42 64,47 Z" fill="url(#wingGradientRight)"/>
    <!-- Bottom Feather / Wing Base -->
    <path d="M 62,50 C 73,47 86,43 99,45 C 89,51 79,62 71,70 C 72,62 67,55 62,50 Z" fill="url(#wingGradientRight)"/>

    <!-- CENTRAL KEYHOLE (Muted Gold Security Core) -->
    <!-- Outer Shield Halo (Subtle) -->
    <circle cx="52" cy="33" r="10" fill="url(#goldGradient)"/>
    <!-- Keyhole Stem -->
    <path d="M 47.5,38 L 56.5,38 L 59.5,58 C 59.5,59.5 58,61 56,61 L 48,61 C 46,61 44.5,59.5 44.5,58 Z" fill="url(#goldGradient)"/>
    <!-- Keyhole Inner Cutout -->
    <circle cx="52" cy="33" r="4.2" fill="#20222B"/>
    <path d="M 50.2,35 L 53.8,35 L 54.8,49 L 49.2,49 Z" fill="#20222B"/>
  </g>

  <!-- BRAND WORDMARK: OllaVPN -->
  <g transform="translate(124, 0)">
    <!-- Olla (Slate Indigo) + VPN (Muted Gold) -->
    <text x="0" y="52" font-family="'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.035em">
      <tspan fill="#323652">Olla</tspan><tspan fill="#D6A04A">VPN</tspan>
    </text>
    
    <!-- Tagline: POST-QUANTUM PRIVACY -->
    <text x="2" y="70" font-family="'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#70769A" letter-spacing="0.22em">
      POST-QUANTUM PRIVACY
    </text>
  </g>
</svg>