name: deploy

# Push to `main` -> build the Astro blog on the NH self-hosted runner
# (LXC 505, label nh-marketing) and publish to the Cloudflare Pages project below.
# wrangler is invoked via npx (NOT cloudflare/wrangler-action, which mis-selects bun).
# Managed by NH Ops. Do not edit without owner review (see CODEOWNERS).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nh-marketing]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy to Cloudflare Pages (ollavpn-blog)
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4 pages deploy dist --project-name ollavpn-blog --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (ollavpn-marketing)
        if: github.ref == 'refs/heads/main'
        run: |
          git clone --depth 1 https://github.com/vikasswaminh/ollavpn-marketing.git _marketing
          cp -r public/blog/* _marketing/blog/
          cp public/styles.css _marketing/styles.css
          cp public/styles.css _marketing/blog/styles.css
          rm -rf _marketing/.git _marketing/.github _marketing/.gitea
          npx --yes wrangler@4 pages deploy _marketing --project-name ollavpn-marketing --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
